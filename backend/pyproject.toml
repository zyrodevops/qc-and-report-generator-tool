[project]
name = "marine-survey-backend"
version = "0.1.0"
description = "Marine Cargo Survey & QC Report Generation Platform Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.28,<3.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "openpyxl>=3.1.2",
    "pandas>=2.2.1",
    "python-docx>=1.1.0",
    "pillow>=10.2.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.1.0",
    "email-validator>=2.0.0",
    "bcrypt>=4.1.2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "fakeredis>=2.21.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
