version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: qc-report-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marine_survey}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marine_survey}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - qc-network

  redis:
    image: redis:7-alpine
    container_name: qc-report-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - qc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qc-report-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-marine_survey}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-marine_survey}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-insecure-dev-secret-change-in-production}
      IRDAI_LICENCE_NUMBER: ${IRDAI_LICENCE_NUMBER:-}
      STORAGE_DIR: /app/storage
      UPLOAD_DIR: /app/storage/uploads
      DERIVED_DIR: /app/storage/derived
      TEMPLATES_DIR: /app/templates
      LIBREOFFICE_BINARY: /usr/bin/libreoffice
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOW_FAKE_REDIS: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qc-report-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - qc-network

networks:
  qc-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
